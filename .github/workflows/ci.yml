name: Go CI

on:
  push:
    branches: [ "main", "iter**" ]
  pull_request:
    branches: [ "main", "iter**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Show Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN

      - name: Install goimports compatible with Go 1.23
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1


